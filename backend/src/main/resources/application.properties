spring.application.name=smart-home-backend

# Oracle 21c XE Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SMART_HOME}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate Configuration (Oracle schema is source of truth)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security & CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# InfluxDB 2.x Time-Series Configuration (DA3)
influxdb.url=${INFLUXDB_URL:http://127.0.0.1:8086}
influxdb.token=${INFLUXDB_TOKEN:da3_super_secret_sensor_telemetry_token_123456789}
influxdb.org=${INFLUXDB_ORG:smarthome_org}
influxdb.bucket=${INFLUXDB_BUCKET:sensor_telemetry}