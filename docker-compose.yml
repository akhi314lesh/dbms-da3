services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-home-backend:latest
    container_name: smart-home-backend-1
    environment:
      INSTANCE_NAME: backend-1
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: SMART_HOME
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-secrets/smart-home-service-account.json
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000
    volumes:
      - "${FIREBASE_CREDENTIALS_PATH:-C:/Users/akhil/OneDrive/Desktop/firebase-secrets/smart-home-service-account.json}:/app/firebase-secrets/smart-home-service-account.json:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smart-home-net

  backend2:
    image: smart-home-backend:latest
    container_name: smart-home-backend-2
    depends_on:
      backend1:
        condition: service_started
    environment:
      INSTANCE_NAME: backend-2
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: SMART_HOME
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-secrets/smart-home-service-account.json
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000
    volumes:
      - "${FIREBASE_CREDENTIALS_PATH:-C:/Users/akhil/OneDrive/Desktop/firebase-secrets/smart-home-service-account.json}:/app/firebase-secrets/smart-home-service-account.json:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smart-home-net

  nginx:
    image: nginx:alpine
    container_name: smart-home-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - smart-home-net

networks:
  smart-home-net:
    driver: bridge
