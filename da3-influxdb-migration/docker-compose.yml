services:
  influxdb:
    image: influxdb:2.7.11-alpine
    container_name: da3-influxdb-server
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-SmartHomeAdminPass123!}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-smarthome_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensor_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-da3_super_secret_sensor_telemetry_token_123456789}
    volumes:
      - da3-influxdb-storage:/var/lib/influxdb2
    networks:
      - da3-influxdb-network

volumes:
  da3-influxdb-storage:
    name: da3-influxdb-storage

networks:
  da3-influxdb-network:
    name: da3-influxdb-network
